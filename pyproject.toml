[project]
name = "cozmo-ai-take-home"
version = "0.1.0"
description = "Cozmo AI take-home assignment"
readme = "README.md"
authors = [
    { name = "Nirmit Rampal", email = "nirmitrampal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.4",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
cozmo-ai-take-home = "cozmo_ai_take_home.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
